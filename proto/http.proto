syntax = "proto3";

package altverse.game.http.v1;

import "buf/validate/validate.proto";

enum AccountRole {
    USER = 0;
    MOD = 1;
    DEV = 2;
    ADMIN = 3;
}

enum ResponseStatus {
    Trouble = 0;
    Ok = 200;
    InternalError = 500;

    InvalidBody = 400;
    NotAuthenticated = 401;
    VerificationFailure = 402;
    NotFound = 404;

    AccountExists = 450;
    AccountNotExists = 451;
    WrongPassword = 452;
}

message Profile {
    uint32 vp = 1;
    string username = 2;
    map<string, string> highest = 3;
    repeated string accessories = 4;
    AccountRole role = 5;
}

message RegisterRequest {
    string username = 1 [
        (buf.validate.field).string.min_len = 1,
        (buf.validate.field).string.max_len = 48
    ];
    string password = 2 [
        (buf.validate.field).string.min_len = 4,
        (buf.validate.field).string.max_len = 256
    ];
    string token = 3 [
        (buf.validate.field).string.min_len = 31,
        (buf.validate.field).string.max_len = 33
    ];
}

message LoginRequest { 
    string username = 1 [
        (buf.validate.field).string.min_len = 1,
        (buf.validate.field).string.max_len = 48
    ];
    string password = 2 [
        (buf.validate.field).string.min_len = 4,
        (buf.validate.field).string.max_len = 256
    ];
}

message LoginAndRegisterResponse {
    optional string token = 2;
    optional Profile profile = 3;
}

message ProfileResponse {
    optional Profile profile = 2;
}

message AuthResponse {
    optional Profile profile = 2;
}

message LogoutResponse {
    ResponseStatus status = 1;
}

message ServerElement {
    string icon = 1;
    string name = 2;
    string domain = 3;
    uint32 online = 4;
}

message ServersResponse {
    ResponseStatus status = 1;
    repeated ServerElement servers = 2;
}

message AdminModeServer {
    string id = 1;
    string icon = 2;
    string name = 3;
    string domain = 4;
}

message AdminModeServersResponse {
    repeated AdminModeServer servers = 1;
    uint32 online = 2;
    uint32 count = 3;
}

message AdminModeServerTokenResponse {
    string token = 1;
}

message AdminModeEditServerRequest {
    string id = 1 [
        (buf.validate.field).string.min_len = 23,
        (buf.validate.field).string.max_len = 25
    ];
    string name = 2 [
        (buf.validate.field).string.min_len = 1,
        (buf.validate.field).string.max_len = 48
    ];
    string icon = 3 [
        (buf.validate.field).string.min_len = 1,
        (buf.validate.field).string.max_len = 10
    ];
    optional string token = 4 [
        (buf.validate.field).string.min_len = 63,
        (buf.validate.field).string.max_len = 65
    ];
    string domain = 5;
}

message AdminModeAddServerRequest {
    string name = 1 [
        (buf.validate.field).string.min_len = 1,
        (buf.validate.field).string.max_len = 48
    ];
    string icon = 2 [
        (buf.validate.field).string.min_len = 1,
        (buf.validate.field).string.max_len = 10
    ];
    optional string token = 3 [
        (buf.validate.field).string.min_len = 63,
        (buf.validate.field).string.max_len = 65
    ];
    string domain = 4;
}

// Server HTTP

enum WorldEffect {
    RAIN = 0;
    RAINSTORM = 1;
    SNOW = 2;
    SNOWSTORM = 3;
    AUTUMN = 4;
}

message WorldProperties {
    message Background {
        string name = 1;
        uint32 alpha = 2;
    }

    string fill_style = 1;
    string stroke_style = 2;
    string area_fill = 3;
    optional uint32 area_alpha = 4;
    repeated Background backgrounds = 5;
    optional WorldEffect effect = 6;
}

message AreaResponse {
    optional bool win = 1;
    optional uint32 vp = 2;
    optional string text = 3;
}

message WorldResponse {
    WorldProperties properties = 1;
    map<string, AreaResponse> areas = 2;
}

message WorldsResponse {
    map<string, WorldResponse> worlds = 1;
}