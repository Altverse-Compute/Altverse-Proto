syntax = "proto3";

package altverse.game.backend.v1;

import "buf/validate/validate.proto";

service Game {
    rpc Authentication(AuthenticationRequest) returns (AuthenticationResponse) {}
    rpc JoinPlayer(JoinPlayerRequest) returns (JoinPlayerResponse) {}
    rpc Ping(PingRequest) returns (PongResponse) {}
    rpc AwardPlayer(AwardRequest) returns (AwardResponse) {}
}

message PingRequest {
    uint32 online = 1;
    bool alive = 21;
}

message PongResponse {
    bool success = 1;
}

message AuthenticationRequest {
    string token = 1 [
        (buf.validate.field).string.min_len = 63,
        (buf.validate.field).string.max_len = 65
    ];
    string id = 2 [
        (buf.validate.field).string.min_len = 23,
        (buf.validate.field).string.max_len = 25
    ];
}

message AuthenticationResponse {
    string session = 1;
}

message JoinPlayerRequest {
    string token = 1 [
        (buf.validate.field).string.min_len = 31,
        (buf.validate.field).string.max_len = 33
    ];
}

message JoinPlayerResponse {
    string name = 1;
    Role role = 2;
    string id = 3;
}

message AwardRequest {
    string id = 1 [
        (buf.validate.field).string.min_len = 23,
        (buf.validate.field).string.max_len = 25
    ];
    optional uint32 vp = 2;
    optional string accessory = 3 [
        (buf.validate.field).string.min_len = 1
    ];;
}

message AwardResponse {
    bool success = 1;
}

enum Role {
    USER = 0;
    MOD = 1;
    DEV = 2;
}